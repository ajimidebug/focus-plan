name: Validate focus-plan changes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/quasar-174]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focus-plan-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/prepare-release.mjs "$(node -p 'require("./package.json").version')"
      - run: npm run check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: verified-spa
          path: dist/spa/
          include-hidden-files: true
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        script: [browser-smoke.mjs, interaction-1732.browser.cjs, interaction-1733.browser.cjs, interaction-1734.browser.cjs, interaction-1735.browser.cjs, interaction-1736.browser.cjs, interaction-1737.browser.cjs, interaction-1738.browser.cjs, interaction-1739.browser.cjs, interaction-17391.browser.cjs, points-account.browser.cjs, framework.browser.cjs, interaction-1742.browser.cjs, interaction-1744.browser.cjs, interaction-1745.browser.cjs]
    env:
      FOCUS_TEST_ROOT: dist/spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: verified-spa
          path: dist/spa
      - run: npx playwright install --with-deps chromium
      - run: node test/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.script }}
          path: test-results/
          if-no-files-found: ignore

  stage-pages:
    # Build a candidate only after every browser check has passed. Publishing is a separate, reviewed PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, browser]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-spa
          path: dist/spa
      - name: Stage verified site against current gh-pages
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          test -f dist/spa/version.json
          test "$(node -p "require('./dist/spa/version.json').id")" = "$(node -p "require('./package.json').version")"
          git fetch origin gh-pages
          git worktree add --detach "$RUNNER_TEMP/focus-pages" origin/gh-pages
          cd "$RUNNER_TEMP/focus-pages"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$GITHUB_WORKSPACE/dist/spa/." .
          git add -A
          git -c user.name="focus-plan release bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "release: 174.6.0 verified SPA"
          git push origin HEAD:refs/heads/release/174.4.0-built
