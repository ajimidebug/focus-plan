name: Validate focus-plan changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat-172-habit-penalties-layout]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-plan-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare temporary release assets
        run: node scripts/prepare-release.mjs ci-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Run release and regression checks
        run: node scripts/check-release.mjs
      - name: Install headless Chromium smoke-test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Run real-browser responsive and dialog checks
        run: node test/browser-smoke.mjs
      - name: Ensure validation does not publish or mutate source branch
        run: |
          echo "Prepared artifacts are local to this runner."
          git status --short
  prepare-release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat-172-habit-penalties-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare final 172.0.0 release assets
        run: node scripts/prepare-release.mjs 172.0.0
      - name: Verify exact release artifact before upload
        run: node scripts/check-release.mjs
      - name: Commit only verified release assets to the review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js version.json js/
          git diff --cached --quiet || git commit -m "build: prepare verified 172.0.0 release artifacts [skip ci]"
          git push origin HEAD:feat-172-habit-penalties-layout
