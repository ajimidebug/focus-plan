name: Validate focus-plan changes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/quasar-174]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focus-plan-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/prepare-release.mjs 174.0.0
      - run: npm run check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: verified-spa
          path: dist/spa/
          include-hidden-files: true
  browser:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        script: [browser-smoke.mjs, interaction-1732.browser.cjs, interaction-1733.browser.cjs, interaction-1734.browser.cjs, interaction-1735.browser.cjs, interaction-1736.browser.cjs, interaction-1737.browser.cjs, interaction-1738.browser.cjs, interaction-1739.browser.cjs, interaction-17391.browser.cjs, points-account.browser.cjs, framework.browser.cjs]
    env:
      FOCUS_TEST_ROOT: dist/spa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: verified-spa
          path: dist/spa
      - run: npx playwright install --with-deps chromium
      - run: node test/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.script }}
          path: test-results/
          if-no-files-found: ignore
