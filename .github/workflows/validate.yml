name: Validate focus-plan changes
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focus-plan-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: node scripts/release-bundle.mjs create
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-spa
          path: .release/candidate/
          include-hidden-files: true
          retention-days: 14
  browser:
    needs: build
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [A, B, C]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: candidate-spa
          path: .release/candidate
      - run: node scripts/release-bundle.mjs check
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN: ${{ github.run_id }}
      - run: mkdir -p dist && cp -a .release/candidate/site dist/spa
      - run: node scripts/test-browser.mjs ${{ matrix.group }}
      - name: Confirm tests used the unchanged candidate
        run: node scripts/check-tested-bundle.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.group }}
          path: browser-results/
          if-no-files-found: warn
          retention-days: 14
  verified:
    name: Release verification
    if: always()
    needs: [build, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every build and browser group
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success
      - name: Summarize candidate
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: echo "Verified candidate for $SOURCE_SHA. Publishing requires the explicit Publish verified site workflow." >> "$GITHUB_STEP_SUMMARY"
