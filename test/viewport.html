<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>窗口适配验收</title><style>body{font:14px system-ui;margin:16px;background:#edf0f4}iframe{display:block;border:1px solid #aaa;background:white;max-width:none}button{padding:8px;margin:4px}p{max-width:800px}</style><p>开发验收：以下为应用的 CSS 可视区域；550×350、770×490 同为宽高比 5.5∶3.5。云浏览器验收不代表主设备或输入法实测。</p><button data-w="550" data-h="350">550×350</button><button data-w="770" data-h="490">770×490</button><button data-w="350" data-h="550">350×550 竖屏</button><output id="input-latency" style="display:block;margin:8px 0">输入响应测量：等待输入</output><iframe id="app-viewport" title="应用验收窗口" width="550" height="350" src="../index.html"></iframe><script>const perfFrame=document.querySelector('iframe');perfFrame.addEventListener('load',()=>{let sequence=0;perfFrame.contentDocument.addEventListener('beforeinput',()=>{const start=performance.now(),epoch=++sequence;requestAnimationFrame(()=>requestAnimationFrame(()=>{if(epoch===sequence)document.querySelector('#input-latency').textContent='本次输入到随后绘制帧：'+(performance.now()-start).toFixed(1)+' ms（云浏览器）';}));},true);});document.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=document.querySelector('iframe');f.width=b.dataset.w;f.height=b.dataset.h;});</script></html>
